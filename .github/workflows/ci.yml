name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# If another commit is pushed to the same branch, don't waste CI time
# finishing the obsolete commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Debug
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Build + tests
  # ---------------------------------------------------------------------------

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            cc: cl
            cxx: cl

          - name: Ubuntu GCC 16
            os: ubuntu-26.04
            cc: gcc-16
            cxx: g++-16

          - name: Ubuntu Clang 18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18

          - name: macOS Clang
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ubuntu-26.04 currently doesn't have GCC 16 preinstalled,
      # but GCC 16 is available from its package repositories.
      - name: Install GCC 16
        if: matrix.cxx == 'g++-16'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Compiler output is cached between workflow runs.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake \
              -S . \
              -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_C_COMPILER=${{ matrix.cc }} \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
              -DOULY_BUILD_TESTS=ON
          else
            cmake \
              -S . \
              -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_C_COMPILER=${{ matrix.cc }} \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DOULY_BUILD_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest
          --test-dir build
          -C ${{ env.BUILD_TYPE }}
          --output-on-failure
          --parallel

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats

  # ---------------------------------------------------------------------------
  # Coverage
  #
  # Run coverage on pushes, not on every PR build. The normal GCC job above
  # already verifies that PRs compile and pass tests.
  # ---------------------------------------------------------------------------

  coverage:
    name: Coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-16 \
            g++-16 \
            lcov

      - name: Configure
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DOULY_BUILD_TESTS=ON \
            -DOULY_TEST_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >
          ctest
          --test-dir build
          -C Debug
          --output-on-failure
          --parallel

      - name: Generate coverage report
        shell: bash
        run: |
          lcov \
          --gcov-tool gcov-14 \
          --capture \
          --directory build \
          --base-directory "${{ github.workspace }}" \
          --output-file coverage.info \
          --no-external \
          --include "${{ github.workspace }}/include/ouly/*" \
          --include "${{ github.workspace }}/src/ouly/*" \
          --ignore-errors mismatch,inconsistent

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # ClangTidy
  #
  # Check if clang tidy build passes
  # ---------------------------------------------------------------------------
  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DOULY_BUILD_TESTS=ON \
            -DOULY_ENABLE_CLANG_TIDY=ON

      - name: Build
        run: cmake --build build --parallel

  # ---------------------------------------------------------------------------
  # Documentation
  #
  # Documentation only needs to be generated/deployed when main changes.
  # ---------------------------------------------------------------------------

  docs:
    name: Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Generate Doxygen XML
        shell: bash
        run: doxygen Doxyfile

      - name: Build documentation
        shell: bash
        run: |
          sphinx-build \
            -b html \
            docs/source \
            docs/build/html \
            -E \
            -a

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
