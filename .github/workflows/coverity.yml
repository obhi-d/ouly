name: Coverity Scan

on:
  # Run manually whenever desired.
  workflow_dispatch:

  # Also run once per week so Coverity doesn't get forgotten.
  # Scheduled workflows run from the repository's default branch.
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: read

env:
  COVERITY_PROJECT_NAME: "obhi-d/ouly"
  BUILD_TYPE: Release

concurrency:
  group: coverity-${{ github.repository }}
  cancel-in-progress: false

jobs:
  coverity:
    name: Coverity Scan
    if: github.repository == 'obhi-d/ouly'
    runs-on: ubuntu-24.04

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # Compiler
      #
      # Coverity does not need to use the newest compiler from the normal CI
      # matrix. GCC 14 is a stable choice for analysis as long as OULY builds
      # with it.
      # -----------------------------------------------------------------------

      - name: Install GCC
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      # -----------------------------------------------------------------------
      # Coverity tool
      #
      # Coverity Scan periodically replaces its supported analysis package.
      # Cache it for one month so normal scans don't repeatedly download the
      # fairly large tool, while still refreshing periodically.
      # -----------------------------------------------------------------------

      - name: Generate Coverity cache key
        id: coverity-cache-key
        shell: bash
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Coverity tool
        id: cache-coverity
        uses: actions/cache@v4
        with:
          path: coverity-linux64
          key: coverity-linux64-${{ steps.coverity-cache-key.outputs.month }}

      - name: Download Coverity tool
        if: steps.cache-coverity.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Downloading current Coverity Scan build tool..."

          curl \
            --fail-with-body \
            --show-error \
            --location \
            --data-urlencode "token=${{ secrets.COVERITY_SCAN_TOKEN }}" \
            --data-urlencode "project=${{ env.COVERITY_PROJECT_NAME }}" \
            --output coverity_tool.tgz \
            https://scan.coverity.com/download/linux64

          tar -xzf coverity_tool.tgz

          COVERITY_DIR=$(find . \
            -maxdepth 1 \
            -type d \
            -name 'cov-analysis-linux64-*' \
            -print \
            -quit)

          if [[ -z "$COVERITY_DIR" ]]; then
            echo "::error::Unable to find extracted Coverity directory"
            exit 1
          fi

          mv "$COVERITY_DIR" coverity-linux64
          rm coverity_tool.tgz

      # -----------------------------------------------------------------------
      # Configure
      # -----------------------------------------------------------------------

      - name: Configure CMake
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DOULY_BUILD_TESTS=ON

      # -----------------------------------------------------------------------
      # Capture
      #
      # Keep tests enabled. For a template-heavy/header-heavy C++ library,
      # test translation units are useful because they instantiate and compile
      # library code that Coverity otherwise might never see.
      # -----------------------------------------------------------------------

      - name: Capture build
        shell: bash
        run: |
          export PATH="$PWD/coverity-linux64/bin:$PATH"

          cov-build \
            --dir cov-int \
            cmake --build build --parallel

      # -----------------------------------------------------------------------
      # Validate capture
      # -----------------------------------------------------------------------

      - name: Verify Coverity capture
        shell: bash
        run: |
          export PATH="$PWD/coverity-linux64/bin:$PATH"

          echo "Captured translation units:"
          cov-manage-emit --dir cov-int list

          if [[ ! -d cov-int ]]; then
            echo "::error::Coverity did not produce cov-int"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Remove third-party translation units.
      #
      # Do NOT remove a TU merely because it includes a libstdc++ header.
      # Nearly every C++ TU does that.
      #
      # Also keep OULY's test TUs because they may instantiate templates from
      # the library. Test paths can instead be ignored/configured separately
      # in Coverity's component configuration if desired.
      # -----------------------------------------------------------------------

      - name: Remove third-party translation units
        shell: bash
        run: |
          export PATH="$PWD/coverity-linux64/bin:$PATH"

          cov-manage-emit \
            --dir cov-int \
            --tu-pattern "file('.*/_deps/.*')" \
            delete

      # -----------------------------------------------------------------------
      # Package and upload
      # -----------------------------------------------------------------------

      - name: Package Coverity capture
        shell: bash
        run: |
          tar -czf ouly-coverity.tgz cov-int

          echo "Archive size:"
          du -h ouly-coverity.tgz

      - name: Submit to Coverity Scan
        shell: bash
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | head -c 100)

          echo "Submitting Coverity scan"
          echo "Project: ${{ env.COVERITY_PROJECT_NAME }}"
          echo "Commit:  $COMMIT_SHA"

          curl \
            --fail-with-body \
            --show-error \
            --form "token=${{ secrets.COVERITY_SCAN_TOKEN }}" \
            --form "email=${{ secrets.COVERITY_SCAN_EMAIL }}" \
            --form "file=@ouly-coverity.tgz" \
            --form "version=$COMMIT_SHA" \
            --form "description=$COMMIT_MSG" \
            "https://scan.coverity.com/builds?project=${{ env.COVERITY_PROJECT_NAME }}"

      # -----------------------------------------------------------------------
      # Diagnostics on failure
      # -----------------------------------------------------------------------

      - name: Upload Coverity diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coverity-diagnostics-${{ github.run_id }}
          path: |
            cov-int/
            build/CMakeFiles/
          retention-days: 7
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # GitHub summary
      # -----------------------------------------------------------------------

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Coverity Scan"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**Status:** ${{ job.status }}"
            echo ""
            echo "Results: https://scan.coverity.com/projects/${{ env.COVERITY_PROJECT_NAME }}"
          } >> "$GITHUB_STEP_SUMMARY"
